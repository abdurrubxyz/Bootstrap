<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .row {
        height: 20.5rem;
        background: lightblue;
        padding: 10px;
        margin-top: 20px;
      }
      .row div {
        border: 5px solid black;
        margin: 0px 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row align-items-end">
        <div class="col">col-1</div>
        <div class="col">col-2</div>
        <div class="col">col-3</div>
      </div>
      <div class="row align-items-center">
        <div class="col">col-1</div>
        <div class="col">col-2</div>
        <div class="col">col-3</div>
      </div>
      <div class="row align-items-start">
        <div class="col">col-1</div>
        <div class="col">col-2</div>
        <div class="col">col-3</div>
      </div>
      <div class="row">
        <div class="col align-self-start">col-1</div>
        <div class="col align-self-center">col-2</div>
        <div class="col align-self-end">col-3</div>
      </div>

      <div class="row row-cols-auto justify-content-center">
        <div class="col">col-1</div>
        <div class="col">col-2</div>
        <div class="col">col-3</div>
      </div>

      <div class="row row-cols-auto justify-content-end">
        <div class="col">col-1</div>
        <div class="col">col-2</div>
        <div class="col">col-3</div>
      </div>

      <div class="row row-cols-auto justify-content-start">
        <div class="col">col-1</div>
        <div class="col">col-2</div>
        <div class="col">col-3</div>
      </div>

      <div class="row row-cols-auto justify-content-between">
        <div class="col">col-1</div>
        <div class="col">col-2</div>
        <div class="col">col-3</div>
      </div>

      <div class="row row-cols-auto justify-content-around">
        <div class="col">col-1</div>
        <div class="col">col-2</div>
        <div class="col">col-3</div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
